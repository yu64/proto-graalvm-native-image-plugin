name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Generate Cargo.lock with cargo update
        run: cargo update

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-release-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-release-

      - name: Build release
        run: cargo build --target wasm32-wasip1 --release

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp target/wasm32-wasip1/release/proto_graalvm_plugin.wasm release/
          cd release
          sha256sum proto_graalvm_plugin.wasm > proto_graalvm_plugin.wasm.sha256
          ls -lh

      - name: Upload WASM artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release/proto_graalvm_plugin.wasm
          asset_name: proto_graalvm_plugin.wasm
          asset_content_type: application/wasm

      - name: Upload SHA256 checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release/proto_graalvm_plugin.wasm.sha256
          asset_name: proto_graalvm_plugin.wasm.sha256
          asset_content_type: text/plain
