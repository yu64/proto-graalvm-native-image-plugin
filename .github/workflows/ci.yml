name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-rust@v1
        with:
          cache: false
          components: rustfmt

      - run: cargo fmt --all --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-rust@v1
        with:
          cache: false
          components: clippy
          targets: wasm32-wasip1

      - run: cargo clippy --target wasm32-wasip1 --lib

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-rust@v1
        with:
          cache: false
          targets: wasm32-wasip1

      - run: cargo test --lib --no-default-features

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-rust@v1
        with:
          cache: false
          targets: wasm32-wasip1

      - run: cargo build --target wasm32-wasip1 --release

