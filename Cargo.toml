[package]
name = "proto-graalvm-native-image-plugin"
version = "0.1.0"
edition = "2024"
description = "A proto WASM plugin for GraalVM Community Native Image."
license = "MIT"
publish = false

[lib]
# WASM plugin output plus a library target for host unit tests.
crate-type = ["cdylib", "lib"]

[dependencies]
extism-pdk = "1.4.1"
proto_pdk = "0.33.0"
proto_pdk_api = "0.32.0"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["wasm"]
wasm = []

[profile.release]
# Keep the downloadable WASM artifact small.
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"
strip = true
