[package]
name = "proto-graalvm-plugin"
version = "0.3.0"
edition = "2021"
authors = ["yu64"]
license = "MIT"
description = "A proto plugin for managing GraalVM Community Edition versions"
repository = "https://github.com/yu64/proto-graalvm-plugin"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Proto Plugin Development Kit
proto_pdk = "0.32"

# Serialization (WASM compatible)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Semantic versioning (WASM compatible)
semver = { version = "1.0", features = ["serde"] }

# Error handling (WASM compatible)
thiserror = "1.0"

# Regular expressions (WASM compatible)
regex = "1.10"

[dev-dependencies]
proto_pdk_test_utils = "0.32"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

# 目標: WASM ファイルサイズを最小化
[profile.wasm]
inherits = "release"
opt-level = "z"
strip = true
